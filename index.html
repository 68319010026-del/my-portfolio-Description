<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>แนะนำตัวเอง</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        .container {
            width: 400px;
            margin: 50px auto;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        p {
            font-size: 16px;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>แนะนำตัวเอง</h1>
        <p><strong>ชื่อ:</strong> อติวัชญ์ พูลดี</p>
        <p><strong>ระดับชั้น:</strong> มัธยมศึกษาปีที่ 6</p>
        <p><strong>โรงเรียน:</strong> โรงเรียนกุมภวาปี</p>
        <p><strong>ความสนใจ:</strong> การสร้างสรรค์ดิจิทัลคอนเทนท์, กราฟฟิกดีไซน์, เทคโนโลยี</p>
        <p><strong>เป้าหมายในอนาคต:</strong> นักสร้างสรรค์นวัตกรรมทางศิลปะและวัฒนธรรม</p>
    </div>

</body>
</html>
